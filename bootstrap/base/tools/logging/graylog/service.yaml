apiVersion: v1
kind: Service
metadata:
  name: graylog-service
  namespace: logging
spec:
  selector:
    app: graylog
  type: NodePort
  ports:
    - protocol: TCP
      port: 9000
      nodePort: 30084
---
apiVersion: v1
kind: Service
metadata:
  name: graylog-headless
  namespace: logging
spec:
  clusterIP: None
  selector:
    app: graylog
  ports:
    - port: 9000
      targetPort: 9000