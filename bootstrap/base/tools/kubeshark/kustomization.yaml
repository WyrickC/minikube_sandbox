apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true

# To apply, run "kustomize build kubeshark --enable-helm | kubectl apply -f -"
# To access locally, run "kubectl port-forward service/kubeshark-front 8443:80"

helmCharts:
  - name: kubeshark
    repo: https://helm.kubeshark.co
    namespace: mon
    releaseName: kubeshark
    version: "52.3.92"
    valuesFile: values.yaml