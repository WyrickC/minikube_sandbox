apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: minio

# Basic minio setup without a backing PVC (no data retained) Add PVCs and volume refs if retention is needed.
# If running locally, run "kubectl port-forward service/minio-ui-service 9002:9001" to access the UI locally (127.0.0.1/8202)
# To retrieve encoded passwords, run "k get secret minio -o jsonpath='{.data}' "
# To decode passwords, run echo "echo "bWluaW9hZG1pbg==" | base64 --decode"

resources:
  - minio-service.yaml
  - namespace.yaml
  - secret.yaml
  - statefulset.yaml