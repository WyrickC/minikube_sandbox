apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mongo

# MongoDB is the backing DB for graylog, but can be used to store other document-oriented data.
# Access via "k exec -it <mongo-pod> -n=mongo -- mongosh
# Use the setup.sh script to assist

resources:
  - deployment.yaml
  - namespace.yaml
  - secret.yaml
  - service.yaml
  - configmap.yaml