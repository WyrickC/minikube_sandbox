global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    prometheus: "true"
    env: "dev"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics.mon.svc.cluster.local:8080']
